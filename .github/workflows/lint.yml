name: Lint Code on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
# A newer push on the same ref supersedes the run in progress: with 10-20 pushes a day per PR, the
# superseded runs were 4-9% of the bill for a verdict nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHAT CHANGED, asked instead of filtered. `paths-ignore` used to sit on the two triggers above and
  # skip the WORKFLOW, and a workflow that never starts leaves its required contexts absent, which
  # GitHub blocks exactly as it blocks a red one: two docs-only PRs in a row (#602, #641) needed a
  # human `--admin` merge that the ship gate's T0 exists to avoid (issue #643). The path list itself
  # lives in changed-code.yml, once, instead of in six trigger blocks.
  #
  # The `if` is the SAME question the real job used to ask, hoisted: when this repo and this event do
  # not want CI at all, nothing below runs and the mirror push stays free. Leaving it off would have
  # charged agents-pro two runners per workflow on all 267 of its monthly mirror pushes, which is the
  # bill the real job's condition was written to avoid in the first place.
  changes:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !(github.repository == 'fazer-ai/agents-pro' && github.event_name == 'push')
    uses: ./.github/workflows/changed-code.yml

  lint-run:
    # agents-pro only ever receives mirror pushes of a tree this master already tested, and the
    # stripped Pro tree is lint + build-checked by `check:editions` before it is mirrored, so this
    # job is skipped there on push (see test.yml). agents (public, free) keeps running on push.
    # No CI while the PR is a draft: the autonomous loop opens its PRs as drafts and marks them ready
    # once the review loop is clean, so the suite runs on the final HEAD, not on every fix push.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache Bun Installation
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-deps-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-deps-

      - name: Install Dependencies
        run: bun install

      - name: Run Biome Linter
        run: bun run lint

  # WHY A SEPARATE JOB HOLDS THE REQUIRED NAME. A job skipped by its own `if` reports the conclusion
  # `skipped`, and whether a required context accepts that is a GitHub behaviour this repo has never
  # measured. This job always RUNS, so the gate never rests on that question.
  lint:
    needs: [changes, lint-run]
    # `always()` so it still reports when the real job was skipped. PULL REQUESTS ONLY, because
    # publishing a required context is the entire reason this job exists and only a PR has one: on
    # push it would be three runners a time that nothing reads, and on the private repos those are
    # paid minutes.
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the real job did not pass
        # `skipped` passes on purpose: a docs-only change skips the real job, and that is not a
        # verdict against the code. A failure in `changes` itself is NOT passed over: not knowing
        # what changed is not evidence that nothing did.
        if: needs.lint-run.result == 'failure' || needs.lint-run.result == 'cancelled' || needs.changes.result != 'success'
        run: exit 1
