# Platform-neutral production stack for fazer.ai agents (Portainer / EasyPanel / plain `docker compose`
# on a VM). Coolify has its own file (docker-compose.coolify.yml, magic-vars); THIS file reads plain
# env vars from a .env you generate with `bun scripts/gen-onboarding-env.ts` (writes every secret/URL
# below, consistently). TLS + reverse proxy are EXTERNAL (Caddy/Traefik/Nginx Proxy Manager): this
# stack only publishes the app's HTTP port on the host — terminate TLS in front of it.
#
# TWO database roles by design (docs/deploy.md, load-bearing): the SUPERUSER (POSTGRES_USER, the
# postgres container's owner) runs db-bootstrap + migrations; the NON-superuser runtime role (encoded
# in DATABASE_URL, created by db-bootstrap from that URL) is what the server runs as, so Postgres RLS
# isolation holds. The boot guard hard-crashes if the runtime role is privileged.
#
# SINGLE replica by construction (the scheduler / debounce / webhook / alert workers + realtime
# pub/sub are single-process). Do NOT scale `agents` to >1 here. To add web replicas, run the
# extras with SCHEDULER_WORKER_ENABLED/WEBHOOK_WORKER_ENABLED/DEBOUNCE_WORKER_ENABLED/
# ALERT_WORKER_ENABLED=false and keep exactly one leader with them on (docs/deploy.md §4).

services:
  agents:
    # Edition-driven: Free (default, public image) vs Pro (set AGENTS_IMAGE to the private
    # Harbor image, project `agents`, after `docker login` — hub: create_registry_credential, per-user).
    # PLACEHOLDER: the public Free image is not published yet — swap `agents` once it exists.
    image: ${AGENTS_IMAGE:-ghcr.io/fazer-ai/agents:latest}
    pull_policy: always
    restart: always
    # NOTE: no `command` here on purpose — the image's default entrypoint already runs, in order:
    # db-bootstrap.ts (idempotent runtime-role provisioning) → prisma migrate deploy → serve
    # interpreted (bun src/index.ts). Overriding risks drifting from that contract.
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_URL=${PUBLIC_URL}
      - CDN_URL=${PUBLIC_URL}
      # NOTE: default to the public URL, NOT `*` — the WS realtime origin check does an exact
      # match, so `*` matches no real Origin and 403s every WebSocket upgrade.
      - CORS_ORIGIN=${CORS_ORIGIN:-${PUBLIC_URL}}
      # Rate-limit keying. OFF here, unlike the bundled-proxy files, because the app port above is
      # published on every interface by default: anyone who can reach it directly could otherwise
      # send an X-Forwarded-For of their choosing and give themselves a private bucket. Before setting
      # this to `true`, narrow the binding (APP_PORT=127.0.0.1:3000) or firewall the port, AND check
      # that your proxy overwrites or appends to X-Forwarded-For instead of passing the client's value
      # through (nginx `$proxy_add_x_forwarded_for`, not `$http_x_forwarded_for`) — otherwise the last
      # entry is still the client's. Leave the hops at 1 unless the proxy nearest to this app is
      # configured to forward the chain it received; see .env.example.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      # NOTE: rate-limit ceilings, per client address. The first two are runaway guards, generous on
      # purpose. The credential pair is the tight one: it covers login, signup, the one-time /setup
      # token and accept-invite, and its window is minutes rather than one minute because a
      # per-minute ceiling resets 60 times an hour. Raise RATE_LIMIT_CREDENTIAL_MAX if a shared
      # office address trips it; the bucket is keyed by IP, so everyone behind one NAT shares it.
      # Boot refuses a credential budget that collides with another limiter's budget+window, or that
      # is not tighter than RATE_LIMIT_USER_PER_MIN. See .env.example.
      - RATE_LIMIT_USER_PER_MIN=${RATE_LIMIT_USER_PER_MIN:-600}
      - RATE_LIMIT_MCP_PER_MIN=${RATE_LIMIT_MCP_PER_MIN:-1200}
      - RATE_LIMIT_CREDENTIAL_MAX=${RATE_LIMIT_CREDENTIAL_MAX:-20}
      - RATE_LIMIT_CREDENTIAL_WINDOW_MINUTES=${RATE_LIMIT_CREDENTIAL_WINDOW_MINUTES:-5}
      # First-run: disable the /setup token in this trusted, TLS-fronted onboarding window (the
      # advisory lock still caps /setup at one admin). Set to `true` to require it.
      - SETUP_TOKEN_REQUIRED=${SETUP_TOKEN_REQUIRED:-false}
      # MCP Dynamic Client Registration, so the operator's AI agent (Claude Code / Codex) can log in
      # to THIS instance's MCP. Also the app default — pinned here so the stack works on an older
      # image too, since without it both clients abort before any login screen (docs/mcp.md).
      - MCP_DCR_ENABLED=${MCP_DCR_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Superuser/owner connection — migrations + bootstrap only. Its user/password MUST match the
      # postgres container's POSTGRES_USER/POSTGRES_PASSWORD below.
      - MIGRATION_DATABASE_URL=${MIGRATION_DATABASE_URL}
      # Runtime role — NON-superuser, NON-bypassrls (db-bootstrap creates it from this URL). RLS holds.
      - DATABASE_URL=${DATABASE_URL}
      # Checkpointer pool — MUST be the runtime (non-superuser) role, never the migration URL.
      - LANGGRAPH_DATABASE_URL=${LANGGRAPH_DATABASE_URL}
      # Persist uploaded branding (logo/favicon) + issued document PDFs on the `storage` volume
      # (mounted below). The defaults (./data/*) live on the ephemeral container FS and vanish on
      # every redeploy.
      - BRANDING_STORAGE_DIR=/app/storage/branding
      - DOCUMENTS_STORAGE_DIR=/app/storage/documents
      # NOTE: kept for installations created before the rename. Platforms that FREEZE a compose
      # value at install time (Coolify) never deliver the new name to an existing install, so
      # dropping this line would send its PDFs to the container filesystem, where a redeploy
      # erases them without a word. config.ts reads DOCUMENTS_STORAGE_DIR first, then this.
      - QUOTES_STORAGE_DIR=/app/storage/quotes
    ports:
      # Host:container. Put a TLS-terminating reverse proxy in front; in untrusted networks bind to
      # 127.0.0.1 (set APP_PORT=127.0.0.1:3000) or firewall the port.
      - '${APP_PORT:-3000}:3000'
    volumes:
      - 'storage:/app/storage'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 20s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # pgvector image (NOT plain postgres): the schema needs CREATE EXTENSION vector. pg17 matches the
    # validated isolation spike. Not published to the host — only the app reaches it over the network.
    image: 'pgvector/pgvector:pg17'
    restart: always
    environment:
      - POSTGRES_DB=${DATABASE_NAME:-fazerai_agents_db}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 20s
      timeout: 20s
      retries: 10

volumes:
  storage:
  postgres:
