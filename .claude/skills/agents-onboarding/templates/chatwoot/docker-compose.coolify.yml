# Chatwoot for fazer.ai: COOLIFY flavor (magic vars; Coolify auto-generates the SERVICE_* secrets).
# Edition by CHATWOOT_IMAGE: default = Pro (private Harbor image); for OSS set
# CHATWOOT_IMAGE=ghcr.io/fazer-ai/chatwoot:latest (our public fork). WhatsApp (native) runs in
# BOTH editions inside the sidekiq container (on by default, no extra service; it creates a
# database of its own on this PostgreSQL on first start). WHATSAPP_CONNECTOR_ENABLED=false turns it off.
# Pro pull needs the Harbor registry credential configured in Coolify (hub: per-user credential); OSS needs none.
# Set the service Domain in Coolify to your Chatwoot FQDN (fills SERVICE_URL_CHATWOOT).
# This is the compose validated in the RUN 2 Coolify deploy; the generic/Portainer flavor is ./docker-compose.yml.

services:
  chatwoot:
    image: '${CHATWOOT_IMAGE:-harbor.fazer.ai/chatwoot/fazer-ai/chatwoot-pro:latest}'
    pull_policy: always
    volumes:
      - 'storage:/app/storage'
    depends_on:
      - postgres
      - redis
    environment:
      - SERVICE_URL_CHATWOOT
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DEFAULT_LOCALE=pt_BR
      - LOG_LEVEL=${RAILS_LOG_LEVEL:-info}
      - 'FRONTEND_URL=${SERVICE_URL_CHATWOOT}'
      - 'INTERNAL_HOST_URL=http://chatwoot:3000'
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - 'POSTGRES_USERNAME=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot_production}'
      - 'SECRET_KEY_BASE=${SERVICE_PASSWORD_64_SECRETKEYBASE}'
      - 'REDIS_URL=redis://redis:6379'
      - 'REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}'
      - 'MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-}'
      - 'RESEND_API_KEY=${RESEND_API_KEY:-}'
      - 'WHATSAPP_CONNECTOR_ENABLED=${WHATSAPP_CONNECTOR_ENABLED:-true}'
      - 'WHATSAPP_CONNECTOR_EMBEDDED=${WHATSAPP_CONNECTOR_EMBEDDED:-true}'
    entrypoint: docker/entrypoints/rails.sh
    command:
      - sh
      - '-c'
      - 'bundle exec rails db:chatwoot_prepare && bundle exec rails branding:update && exec bundle exec rails s -p 3000 -b 0.0.0.0'
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- --header="Accept: text/html" http://127.0.0.1:3000/']
      interval: 20s
      timeout: 10s
      retries: 5
  sidekiq:
    image: '${CHATWOOT_IMAGE:-harbor.fazer.ai/chatwoot/fazer-ai/chatwoot-pro:latest}'
    pull_policy: always
    volumes:
      - 'storage:/app/storage'
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DEFAULT_LOCALE=pt_BR
      - LOG_LEVEL=${RAILS_LOG_LEVEL:-info}
      - 'FRONTEND_URL=${SERVICE_URL_CHATWOOT}'
      - 'INTERNAL_HOST_URL=http://chatwoot:3000'
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - 'POSTGRES_USERNAME=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot_production}'
      - 'SECRET_KEY_BASE=${SERVICE_PASSWORD_64_SECRETKEYBASE}'
      - 'REDIS_URL=redis://redis:6379'
      - 'REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}'
      - 'MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-}'
      - 'RESEND_API_KEY=${RESEND_API_KEY:-}'
      - 'WHATSAPP_CONNECTOR_ENABLED=${WHATSAPP_CONNECTOR_ENABLED:-true}'
      - 'WHATSAPP_CONNECTOR_EMBEDDED=${WHATSAPP_CONNECTOR_EMBEDDED:-true}'
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    # Sidekiq and the embedded WhatsApp connector both drain on SIGTERM: the connector hands its
    # sessions back before exiting. Docker's default of 10 s cuts that short.
    stop_grace_period: 30s
    restart: always
    healthcheck:
      # The entrypoint scripts carry the word sidekiq in their argv too; drop them from the match.
      test: ['CMD-SHELL', 'ps aux | grep "[s]idekiq" | grep -qv entrypoints']
      interval: 20s
      timeout: 10s
      retries: 5
  postgres:
    image: 'ghcr.io/fazer-ai/pgvector:16'
    restart: always
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-chatwoot_production}'
      - 'POSTGRES_USER=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 20s
      timeout: 20s
      retries: 10
  redis:
    image: 'redis:alpine'
    restart: always
    command: ['sh', '-c', 'redis-server --requirepass "${SERVICE_PASSWORD_REDIS}"']
    volumes:
      - 'redis:/data'
    environment:
      - 'REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -h localhost -p 6379 -a $${REDIS_PASSWORD} ping']
      interval: 20s
      timeout: 20s
      retries: 10

volumes:
  storage:
  postgres:
  redis:
