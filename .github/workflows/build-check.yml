name: Build Check on PR

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'licensing/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'licensing/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# A newer push on the same ref supersedes the run in progress: with 10-20 pushes a day per PR, the
# superseded runs were 4-9% of the bill for a verdict nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    # agents-pro only ever receives mirror pushes of a tree this master already tested, and the
    # stripped Pro tree is lint + build-checked by `check:editions` before it is mirrored, so this
    # job is skipped there on push (see test.yml). agents (public, free) keeps running on push.
    if: ${{ !(github.repository == 'fazer-ai/agents-pro' && github.event_name == 'push') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache Bun Installation
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-deps-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-deps-

      - name: Install Dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bunx prisma generate
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      - name: Check i18n locale files are up-to-date
        run: |
          bun i18n:extract
          git diff --exit-code src/client/locales/ src/api/locales/ || (echo "Locale files are out of date. Run 'bun i18n:extract' and commit the changes." && exit 1)

      - name: Run TypeScript type check
        run: bun run build-check

      # The root tsconfig excludes workers/, so the CDN worker needs its own
      # pass. It ships to production via `wrangler deploy`, which bundles with
      # esbuild and never type-checks — without this step nothing does.
      - name: Run TypeScript type check (CDN worker)
        run: bun run build-check:worker

      - name: Check openapi.json is up-to-date
        run: bun run openapi:check
