# Chatwoot for fazer.ai: GENERIC flavor (Portainer / EasyPanel / Dokploy / plain Docker).
#
# ONE file, BOTH editions, selected by env (see ./README.md):
#   - OSS (no hub subscription): defaults, our public `ghcr.io/fazer-ai/chatwoot` fork.
#   - Pro (hub subscription): set CHATWOOT_IMAGE to the Harbor image (adds Kanban + other Pro
#     features). Requires `docker login harbor.fazer.ai` with the license registry credential
#     (hub: generate_install_script).
# WhatsApp (native) ships in BOTH editions with no extra service: the image runs the connector
# inside the sidekiq container, on by default, with a database of its own that it creates on
# this PostgreSQL on first start (so POSTGRES_USER must be able to create databases; the
# postgres image's own user can). WHATSAPP_CONNECTOR_ENABLED=false turns it off.
#
# Secrets come from a .env you fill in (see ./.env.example); Coolify generates those automatically,
# so it has its own file (./docker-compose.coolify.yml). TLS + reverse proxy are EXTERNAL: this stack
# only publishes Chatwoot's HTTP port on the host (default 127.0.0.1:3001); terminate TLS in front
# (the fazer.ai agents bundled Caddy can front chatwoot.<domain> at it; see the agents-onboarding skill).
#
#   cp .env.example .env   # fill every CHANGE_ME, then:
#   docker compose up -d   # OSS. For Pro: docker login harbor.fazer.ai, then set
#                          # CHATWOOT_IMAGE to the chatwoot-pro image and run docker compose up -d.

x-chatwoot-env: &chatwoot-env
  NODE_ENV: production
  RAILS_ENV: production
  INSTALLATION_ENV: docker
  DEFAULT_LOCALE: '${CHATWOOT_LOCALE:-en}'
  LOG_LEVEL: '${RAILS_LOG_LEVEL:-info}'
  FRONTEND_URL: '${CHATWOOT_URL}'
  INTERNAL_HOST_URL: 'http://chatwoot:3000'
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_USERNAME: '${POSTGRES_USER}'
  POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
  POSTGRES_DATABASE: '${POSTGRES_DB:-chatwoot_production}'
  SECRET_KEY_BASE: '${SECRET_KEY_BASE}'
  REDIS_URL: 'redis://redis:6379'
  REDIS_PASSWORD: '${REDIS_PASSWORD}'
  # WhatsApp (native): false turns the channel off; EMBEDDED=false keeps a separate connector instead.
  WHATSAPP_CONNECTOR_ENABLED: '${WHATSAPP_CONNECTOR_ENABLED:-true}'
  WHATSAPP_CONNECTOR_EMBEDDED: '${WHATSAPP_CONNECTOR_EMBEDDED:-true}'

services:
  chatwoot:
    # OSS default (our fork); for Pro set CHATWOOT_IMAGE=harbor.fazer.ai/chatwoot/fazer-ai/chatwoot-pro:latest
    image: '${CHATWOOT_IMAGE:-ghcr.io/fazer-ai/chatwoot:latest}'
    pull_policy: always
    volumes:
      - 'storage:/app/storage'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *chatwoot-env
    entrypoint: docker/entrypoints/rails.sh
    command:
      - sh
      - '-c'
      - 'bundle exec rails db:chatwoot_prepare && exec bundle exec rails s -p 3000 -b 0.0.0.0'
    ports:
      # Host:container. Front with your own TLS-terminating reverse proxy; bound to localhost by default.
      - '${CHATWOOT_PORT:-127.0.0.1:3001}:3000'
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- --header="Accept: text/html" http://127.0.0.1:3000/ || exit 1']
      interval: 20s
      timeout: 10s
      retries: 10

  sidekiq:
    image: '${CHATWOOT_IMAGE:-ghcr.io/fazer-ai/chatwoot:latest}'
    pull_policy: always
    volumes:
      - 'storage:/app/storage'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *chatwoot-env
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    # Sidekiq and the embedded WhatsApp connector both drain on SIGTERM: the connector hands its
    # sessions back before exiting. Docker's default of 10 s cuts that short.
    stop_grace_period: 30s
    restart: always
    healthcheck:
      # The entrypoint scripts carry the word sidekiq in their argv too; drop them from the match.
      test: ['CMD-SHELL', 'ps aux | grep "[s]idekiq" | grep -qv entrypoints']
      interval: 20s
      timeout: 10s
      retries: 5

  postgres:
    # pgvector (Chatwoot 4.x "Captain" AI uses the vector extension). Public image, no auth needed.
    image: '${POSTGRES_IMAGE:-pgvector/pgvector:pg16}'
    restart: always
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-chatwoot_production}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 20s
      timeout: 20s
      retries: 10

  redis:
    image: 'redis:alpine'
    restart: always
    command: ['sh', '-c', 'redis-server --requirepass "$${REDIS_PASSWORD}"']
    volumes:
      - 'redis:/data'
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -h localhost -p 6379 -a $${REDIS_PASSWORD} ping | grep -q PONG']
      interval: 20s
      timeout: 20s
      retries: 10

volumes:
  storage:
  postgres:
  redis:
