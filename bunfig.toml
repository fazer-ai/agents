[serve.static]
plugins = ["bun-plugin-tailwind"]
env = "BUN_PUBLIC_*"

[test]
# NOTE: the order is load-bearing — dom-setup.ts installs happy-dom's `document`
# before setup.ts imports @testing-library (which snapshots `screen` at import
# time). See tests/dom-setup.ts.
preload = ["./tests/dom-setup.ts", "./tests/dns-guard.ts", "./tests/setup.ts"]
root = "./tests"
