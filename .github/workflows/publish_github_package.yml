name: Publish Docker image to GitHub packages

permissions:
  contents: read
  packages: write

on:
  release:
    types: [released]
  workflow_dispatch:

env:
  # NOTE: Edition-aware image name derived from the repo it runs in. In the master this is
  # disabled (gh workflow disable); it publishes only from the derived repos:
  # fazer-ai/agents -> ghcr.io/fazer-ai/agents (Free), fazer-ai/agents-pro -> .../agents-pro (Pro).
  GITHUB_REPO: ghcr.io/${{ github.repository }}

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    if: vars.R2_BUCKET_NAME != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun prisma generate
        env:
          DATABASE_URL: 'postgres://localhost:5432/dummy'

      - name: Build frontend assets
        run: bun run build
        env:
          NODE_ENV: production
          BUN_PUBLIC_CDN_URL: ${{ secrets.BUN_PUBLIC_CDN_URL }}
          BUN_PUBLIC_EDITION: ${{ vars.BUN_PUBLIC_EDITION || 'full' }}

      - name: Upload assets to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          echo "📦 Uploading assets from dist/ to R2..."
          cd dist
          find . -type f | while IFS= read -r file; do
            key="${file#./}"
            echo "Uploading $key"
            bunx wrangler r2 object put "${{ vars.R2_BUCKET_NAME }}/$key" --file "$file" --remote
          done
          echo "✅ All assets uploaded"

      - name: Deploy CDN Worker
        if: vars.CDN_WORKER_DISABLED != 'true'
        run: bunx wrangler deploy
        working-directory: workers/cdn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # NOTE: arm64 hosted runners are free only on public repos. fazer-ai/agents (Free) is public,
  # so it builds amd64 + arm64 on GitHub-hosted runners. fazer-ai/agents-pro is private, so it
  # builds amd64 + arm64 on Blacksmith runners (app installed on the fazer-ai org; one native
  # runner per arch, no QEMU). Any other private repo (this master, forks without Blacksmith)
  # falls back to amd64-only on GitHub-hosted runners. The matrix follows the repo it runs in,
  # with no edit needed either way.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Compute build matrix (repo-aware runners + platforms)
        id: matrix
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO" = "fazer-ai/agents-pro" ]; then
            echo 'matrix={"include":[{"platform":"linux/amd64","runner":"blacksmith-4vcpu-ubuntu-2404","builder":"blacksmith"},{"platform":"linux/arm64","runner":"blacksmith-4vcpu-ubuntu-2404-arm","builder":"blacksmith"}]}' >> "$GITHUB_OUTPUT"
          elif [ "$VISIBILITY" = "public" ]; then
            echo 'matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-22.04-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-latest"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [upload-assets, setup]
    if: always() && needs.setup.result == 'success' && (needs.upload-assets.result == 'success' || needs.upload-assets.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      GIT_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "Updating package.json version to $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        if: matrix.builder != 'blacksmith'
        uses: docker/setup-buildx-action@v4

      - name: Setup Blacksmith Docker builder
        if: matrix.builder == 'blacksmith'
        uses: useblacksmith/setup-docker-builder@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        if: matrix.builder != 'blacksmith'
        id: build-ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUN_PUBLIC_CDN_URL=${{ secrets.BUN_PUBLIC_CDN_URL }}
            BUN_PUBLIC_EDITION=${{ vars.BUN_PUBLIC_EDITION || 'full' }}
          tags: |
            ${{ env.GITHUB_REPO }}:latest
            ${{ env.GITHUB_REPO }}:${{ github.sha }}
            ${{ env.GITHUB_REPO }}:${{ github.ref_name }}
          # NOTE: registry cache, not gha: this workflow runs on a release, so on a tag ref, and a
          # GitHub Actions cache written from a tag is visible only to that tag and the default
          # branch. With gha every release started cold and shipped every layer again.
          cache-from: type=registry,ref=${{ env.GITHUB_REPO }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.GITHUB_REPO }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,ignore-error=true

      # NOTE: same build, Blacksmith flavor — layer cache is persisted by Blacksmith itself
      # (sticky disks), so the gha cache-from/to pair is intentionally absent here.
      - name: Build and push to GitHub Container Registry (Blacksmith)
        if: matrix.builder == 'blacksmith'
        id: build-ghcr-blacksmith
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUN_PUBLIC_CDN_URL=${{ secrets.BUN_PUBLIC_CDN_URL }}
            BUN_PUBLIC_EDITION=${{ vars.BUN_PUBLIC_EDITION || 'full' }}
          tags: |
            ${{ env.GITHUB_REPO }}:latest
            ${{ env.GITHUB_REPO }}:${{ github.sha }}
            ${{ env.GITHUB_REPO }}:${{ github.ref_name }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-ghcr.outputs.digest || steps.build-ghcr-blacksmith.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    # NOTE: build's `if: always()` + upload-assets skipped (no R2) makes merge's default success()
    # evaluate false (a skipped ancestor), silently skipping the multi-arch manifest step. Gate
    # explicitly on build so the manifest is assembled whenever the build succeeded, R2 or not.
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.GITHUB_REPO }}:latest \
            -t ${{ env.GITHUB_REPO }}:${{ github.sha }} \
            -t ${{ env.GITHUB_REPO }}:${GIT_REF} \
            $(printf '${{ env.GITHUB_REPO }}@sha256:%s ' *)

      - name: Inspect image
        env:
          GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          REPO="${{ env.GITHUB_REPO }}"
          docker buildx imagetools inspect ${REPO}:latest
          docker buildx imagetools inspect ${REPO}:${{ github.sha }}
          docker buildx imagetools inspect ${REPO}:${GIT_REF}
